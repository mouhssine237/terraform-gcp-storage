
name: Terraform CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1

      - name: Start Fake GCS Server
        run: docker compose up -d

      - name: Wait for Fake GCS Server
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:4443/storage/v1/b > /dev/null; then
              echo "Fake GCS Server is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Fake GCS Server failed to start"
          docker compose logs
          exit 1

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false

      - name: Stop Fake GCS Server
        if: always()
        run: docker compose down
